# Reuses the exact same Key Vault + Managed Identity as
# k8s/workload-identity/ — myapp's ServiceAccount has its own federated
# credential for this identity now (terraform/workload-identity.tf), so its
# Dapr sidecar authenticates via Azure AD Workload Identity automatically:
# no clientSecret/clientCertificate field, no credentials anywhere.
# azureClientId changes every session (the Managed Identity is destroyed and
# recreated with terraform destroy/apply) — envsubst'd by
# scripts/start-session.sh, same as k8s/workload-identity/pod.yaml.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: keyvault
  namespace: default
spec:
  type: secretstores.azure.keyvault
  version: v1
  metadata:
    - name: vaultName
      value: "${KEY_VAULT_NAME}"
    - name: azureTenantId
      value: "${TENANT_ID}"
    - name: azureClientId
      value: "${WORKLOAD_IDENTITY_CLIENT_ID}"
