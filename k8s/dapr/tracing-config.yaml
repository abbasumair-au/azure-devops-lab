# Points every sidecar that references this Configuration (via the
# dapr.io/config pod annotation) at the SAME otel-collector myapp already
# exports its own spans to — Dapr call spans and myapp's own spans end up
# in the same Tempo trace, no separate observability stack for Dapr.
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: dapr-tracing
  namespace: default
spec:
  tracing:
    samplingRate: "1"
    otel:
      endpointAddress: "otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317"
      isSecure: false
      protocol: grpc
