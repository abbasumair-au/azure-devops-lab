# Default values for myapp.
replicaCount: 1

image:
  repository: umairlabacr.azurecr.io/myapp
  pullPolicy: Always
  tag: "8"

service:
  type: ClusterIP
  port: 5000

containerPort: 5000

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations:
    # Azure AD Workload Identity — patched by scripts/start-session.sh (sed)
    # from `terraform output workload_identity_client_id`. Same mechanism as
    # k8s/workload-identity/, a second federated credential
    # (terraform/workload-identity.tf) scoped to this exact ServiceAccount.
    # The Dapr sidecar shares this Pod's identity, which is how
    # k8s/dapr/components/secretstore.yaml authenticates with zero credentials.
    azure.workload.identity/client-id: ""
  name: ""

podAnnotations:
  dapr.io/enabled: "true"
  dapr.io/app-id: "myapp"
  dapr.io/app-port: "5000"
  dapr.io/config: "dapr-tracing"
podLabels:
  # Required by AKS's workload identity webhook to inject the federated
  # token volume into every container in the Pod, sidecar included.
  azure.workload.identity/use: "true"
podSecurityContext: {}
securityContext: {}

livenessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
# Legacy Ingress support is disabled; north-south traffic now goes through
# the Gateway API (NGINX Gateway Fabric). See httpRoute below.
ingress:
  enabled: false

httpRoute:
  enabled: true
  annotations: {}
  # Attaches to the shared myapp-gateway managed by NGINX Gateway Fabric.
  # No sectionName -> the route binds to every listener (HTTP :80 and HTTPS :443).
  parentRefs:
    - name: myapp-gateway
      namespace: nginx-gateway
  # Empty -> the route serves whatever hostnames the gateway listeners allow.
  hostnames: []
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
